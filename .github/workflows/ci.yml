name: CI
on:
  push:
    branches: main
  pull_request:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.test.outputs.version }}
      snapshot:
        value: ${{ jobs.test.outputs.snapshot }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          curl -fsSL https://github.com/scalameta/scalafmt/releases/download/v3.11.1/scalafmt-x86_64-pc-linux.zip -o "$RUNNER_TEMP/scalafmt.zip"
          unzip -q "$RUNNER_TEMP/scalafmt.zip" -d "$RUNNER_TEMP/scalafmt"
          chmod +x "$RUNNER_TEMP/scalafmt/scalafmt"
          "$RUNNER_TEMP/scalafmt/scalafmt" --test
      - run: |
          curl -fsSL https://github.com/sake92/deder/releases/download/v0.22.2/deder-client-linux-x86_64 -o "$RUNNER_TEMP/deder"
          chmod +x "$RUNNER_TEMP/deder"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check versions
        id: version
        shell: bash
        run: |
          versions=$(deder exec -t version)
          echo "$versions"
          version=$(sed -nE 's/^[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?)$/\1/p' <<< "$versions" | sort -u)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Expected one version across all modules"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev libgc-dev
      - run: deder exec -t compile
      - run: deder exec -t test
      - run: deder exec -m fixture-native -t nativeLink
      - run: .deder/out/fixture-native/nativeLink/fixture-native --smoke

  publish-snapshots:
    if: github.repository == 'sake92/potateh' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.snapshot == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEDER_PUBLISH_SNAPSHOT: ${{ needs.test.outputs.snapshot }}
      DEDER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      DEDER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Deder
        run: |
          curl -fsSL https://github.com/sake92/deder/releases/download/v0.22.2/deder-client-linux-x86_64 -o "$RUNNER_TEMP/deder"
          chmod +x "$RUNNER_TEMP/deder"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Publish snapshots
        run: deder exec -t publish
