name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          curl -fsSL https://github.com/sake92/deder/releases/download/v0.22.2/deder-client-linux-x86_64 -o /usr/local/bin/deder
          chmod +x /usr/local/bin/deder
      - run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev libgc-dev
      - run: deder exec -t compile
      - run: deder exec -t test
