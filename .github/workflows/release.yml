name: Release

on:
  push:
    tags: 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: tests
    if: github.repository == 'sake92/potateh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEDER_SONATYPE_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      DEDER_SONATYPE_PGP_SECRET: ${{ secrets.PGP_SECRET }}
      DEDER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      DEDER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - name: Check release version
        env:
          VERSION: ${{ needs.tests.outputs.version }}
          SNAPSHOT: ${{ needs.tests.outputs.snapshot }}
        run: |
          if [[ "$SNAPSHOT" != false || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match the resolved non-snapshot version"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Deder
        run: |
          curl -fsSL https://github.com/sake92/deder/releases/download/v0.22.2/deder-client-linux-x86_64 -o "$RUNNER_TEMP/deder"
          chmod +x "$RUNNER_TEMP/deder"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Publish to Maven Central
        run: deder exec -t publish
