version = 3.11.1
runner.dialect = scala3
preset = default
maxColumn = 120

newlines.topLevelStatementBlankLines = [
  {
    regex = "Defn\\.(Class|Trait|Object|Enum)"
    minBreaks = 0
    blanks = 1
  }
  {
    regex = "(Defn|Decl)\\.Def"
    minBreaks = 0
    blanks {
      before = 1
      after = 1
      beforeAll = 0
      afterAll = 0
    }
  }
]

rewrite.rules = [RemoveSemicolons, PreferCurlyFors, Imports]
rewrite.imports.sort = ascii
rewrite.imports.groups = [["java\\..*"], ["scala\\..*"]]
rewrite.preferCurlyFors.removeTrailingSemicolonsOnly = false

rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.optionalBraces.enabled = false
rewrite.insertBraces {
  allBlocks = true
  settings {
    minBreaks = 1
    countBreakBefore = true
  }
}
