# Linux only: the existing fixture binds a random loopback port on the host.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    network_mode: host
    entrypoint: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ${PROXY_CONFIG:?runner supplies config}:/etc/caddy/Caddyfile:ro
  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    network_mode: host
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ${PROXY_CONFIG:?runner supplies config}:/etc/nginx/nginx.conf:ro
